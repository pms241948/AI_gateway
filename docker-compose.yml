services:
  # ===========================================
  # Backend API
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_gateway_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_gateway:${DB_PASSWORD:-password}@postgres:5432/ai_gateway
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DEBUG=true
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost","http://localhost:3000","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai_gateway_network
    restart: unless-stopped

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: ai_gateway_postgres
    environment:
      - POSTGRES_DB=ai_gateway
      - POSTGRES_USER=ai_gateway
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_gateway_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ai_gateway" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis (Cache & Queue)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: ai_gateway_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai_gateway_network
    restart: unless-stopped

networks:
  ai_gateway_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
